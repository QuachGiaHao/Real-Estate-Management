<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- START head -->
<head th:replace="~{fragments/head :: head}"><title>Metro Exodus</title></head>
<!-- END head -->

<body>
    <!-- START header -->
    <header th:replace="~{fragments/header :: header}"></header>
    <!-- END header -->

    <section class="ftco-section ftco-no-pb">
        <div class="container">
            <div class="row d-flex mb-12 contact-info justify-content-center">
                <div class="col-md-12 align-items-stretch d-flex">

                    <form th:action="@{/Metro/dang-nhap}" method="post" class="bg-light p-5" style="width:100%">
                        <h1>Đăng nhập</h1>

                        <div class="form-group">
                            <label for="email">Email: </label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Nhập Email">
                        </div>
                        <div class="form-group">
                            <label for="password">Mât khẩu: </label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu">
                        </div>

	                    <div th:if="${error}" class="alert alert-danger" role="alert">
		                    <p th:text="${error}"></p>
	                    </div>

                        <p>Bạn chưa có tài khoản: <a th:href="@{/Metro/dang-ky}">Đăng ký</a></p>
                        <div class="form-group">
                            <input type="submit" value="Đăng nhập" class="btn btn-primary py-3 px-5">
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </section>

    <!-- START footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <!-- END footer -->

    <!-- loader -->
    <div id="ftco-loader" class="show fullscreen">
        <svg class="circular" width="48px" height="48px">
            <circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/>
            <circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/>
        </svg>
    </div>

    <!-- START Script -->
    <div th:replace="~{fragments/script :: script}"></div>
    <!-- End Script -->
  </body>
</html>
