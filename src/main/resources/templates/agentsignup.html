<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- START head -->
<head th:replace="~{fragments/head :: head}"><title>Metro Exodus</title></head>
<!-- END head -->

<body>
<!-- START header -->
<header th:replace="~{fragments/header :: header}"></header>
<!-- END header -->

<section class="ftco-section ftco-no-pb">
	<div class="container">
		<div class="row d-flex mb-12 contact-info justify-content-center">
			<div class="col-md-12 align-items-stretch d-flex">

				<form th:action="@{/Metro/dang-ky-moi-gioi}" method="post" enctype="multipart/form-data" class="bg-light p-5" style="width:100%">
					<h1>Đăng ký trở thành môi giới của chúng tôi.</h1>
					<h5>(Lưu ý: nếu bạn đăng ký làm môi giới, mọi thông tin của bạn sẽ được công khai.)</h5>
					<p></p>

					<div th:if="${message}" class="alert alert-success" role="alert">
						<p th:text="${message}"></p>
					</div>

					<div class="form-group">
						<label for="name">Tên đầy đủ: </label>
						<input type="text" id="name" name="name" class="form-control" placeholder="Tên đầy đủ" required>
					</div>
					<div class="form-group">
						<label for="email">Email: </label>
						<input type="email" id="email" name="email" class="form-control" placeholder="Email" required>
					</div>
					<div class="form-group">
						<label for="phone">Số điện thoại: </label>
						<input type="text" id="phone" name="phone" class="form-control" placeholder="Số điện thoại" required>
					</div>
					<div class="form-group">
						<label for="birthday">Ngày sinh(mm-dd-yyyy): </label>
						<input type="date" id="birthday" name="birthday" class="form-control" min="1900-01-01" max="2020-12-31" required>
					</div>
					<div class="form-group">
						<label for="address">Địa chỉ: </label>
						<input type="text" id="address" name="address" class="form-control" placeholder="Địa chỉ" required>
					</div>
					<div class="form-group">
						<label for="image">Hình ảnh chứng chỉ hành nghề (tùy chọn): </label>
						<input type="file" accept="image/*" id="image" name="image" class="form-control">
					</div>
					<div class="form-group">
						<label for="password">Mật khẩu: </label>
						<input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
					</div>
					<div class="form-group">
						<label for="confirmPassword">Xác nhận mật khẩu: </label>
						<input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Xác nhận mật khẩu" required>
					</div>

					<div th:if="${error}" class="alert alert-danger" role="alert">
						<p th:text="${error}"></p>
					</div>

					<p>Bạn đã có tài khoản: <a th:href="@{/Metro/dang-nhap}">Đăng Nhập</a></p>
					<p>Bạn muốn đăng ký người mua bình thường: <a th:href="@{/Metro/dang-ky}">Đăng ký</a></p>
					<div class="form-group">
						<input type="submit" value="Đăng ký" class="btn btn-primary py-3 px-5">
					</div>
				</form>

			</div>
		</div>
	</div>
</section>

<!-- START footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<!-- END footer -->

<!-- loader -->
<div id="ftco-loader" class="show fullscreen">
	<svg class="circular" width="48px" height="48px">
		<circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/>
		<circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/>
	</svg>
</div>

<!-- START Script -->
<div th:replace="~{fragments/script :: script}"></div>
<!-- End Script -->
</body>
</html>
