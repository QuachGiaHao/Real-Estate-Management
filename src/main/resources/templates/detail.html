<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- START head -->
<head th:replace="~{fragments/head :: head}"><title>Metro Exodus</title></head>
<!-- END head -->

<body>
<!-- START header -->
<header th:replace="~{fragments/header :: header}"></header>
<!-- END header -->


<section class="hero-wrap hero-wrap-2 ftco-degree-bg js-fullheight" style="background-image: url('/images/bg_1.jpg');" data-stellar-background-ratio="0.5">
	<div class="overlay"></div>
	<div class="overlay-2"></div>
	<div class="container">
		<div class="row no-gutters slider-text js-fullheight align-items-end justify-content-center" th:object="${property}">
			<div class="col-md-9 ftco-animate pb-5 mb-5 text-center">
				<h1 class="mb-3 bread">Chi tiết</h1>
				<p class="breadcrumbs"><span class="mr-2"><a th:href="@{/Metro/trang-chu}">Trang chủ <i class="ion-ios-arrow-forward"></i></a></span> <span>Chi tiết <i class="ion-ios-arrow-forward"> <span th:text="${property.name}"></span></i></span></p>
			</div>
		</div>
	</div>
</section>

<section class="ftco-section ftco-property-details">
	<div class="container" th:object="${property}">
		<div class="row justify-content-center">
			<div class="col-md-12">
				<div class="property-details">
					<div class="img rounded" th:style="'background-image: url(' + ${property.base64Image} + ')'"></div>
					<div class="text">
						<h2 th:text="${property.name}"></h2>
						<span class="subheading" th:text="${property.address}"></span>
					</div>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-md-12 pills">
				<div class="bd-example bd-example-tabs">
					<div class="d-flex">
						<ul class="nav nav-pills mb-2" id="pills-tab" role="tablist">
							<li class="nav-item">
								<a class="nav-link active" id="pills-description-tab" data-toggle="pill" href="#pills-description" role="tab" aria-controls="pills-description" aria-expanded="true">Thông tin</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" id="pills-manufacturer-tab" data-toggle="pill" href="#pills-manufacturer" role="tab" aria-controls="pills-manufacturer" aria-expanded="true">Mô tả</a>
							</li>
						</ul>
					</div>

					<div class="tab-content" id="pills-tabContent">
						<div class="tab-pane fade show active" id="pills-description" role="tabpanel" aria-labelledby="pills-description-tab">
							<div class="row">
								<div class="col-md-4">
									<ul class="features">
										<li class="check"><span class="ion-ios-checkmark-circle"></span><p th:text="'Diện tích: ' + ${property.area} + ' m²'"></p></li>
										<li class="check"><span class="ion-ios-checkmark-circle"></span><p th:text="'Phòng ngủ: ' + ${property.bedroom} + ' phòng'"></p></li>
										<li class="check"><span class="ion-ios-checkmark-circle"></span><p th:text="'Phòng tắm: ' + ${property.bathroom} + ' phòng'"></p></li>
									</ul>
								</div>
								<div class="col-md-4">
									<ul class="features">
										<li class="check"><span class="ion-ios-checkmark-circle"></span><p th:text="'Nội thất: ' + ${property.interior}"></p></li>
										<li class="check"><span class="ion-ios-checkmark-circle"></span><p th:text="'Loại nhà đất: ' + ${property.type}"></p></li>
										<li class="check"><span class="ion-ios-checkmark-circle"></span><p th:text="'Mua/Thuê: ' + ${property.sale_rent}"></p></li>
									</ul>
								</div>
								<div class="col-md-4">
									<ul class="features">
										<li class="check"><span class="ion-ios-checkmark-circle"></span><p th:text="'Mức giá: ' + ${property.price}"></p></li>
										<li><button class="btn" id="request">Yêu cầu xem trước</button></li>
									</ul>
								</div>
							</div>
						</div>

						<div class="tab-pane fade" id="pills-manufacturer" role="tabpanel" aria-labelledby="pills-manufacturer-tab">
							<p th:text="${property.description}"></p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

<!-- START footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<!-- END footer -->

<!-- loader -->
<div id="ftco-loader" class="show fullscreen">
	<svg class="circular" width="48px" height="48px">
		<circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/>
		<circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/>
	</svg>
</div>

<!-- START Script -->
<div th:replace="~{fragments/script :: script}"></div>
<!-- End Script -->

<script>
	$("#request").click(function() {

        $.ajax({
            type: "GET",
            url: "/gui-email",
            success: function (response) {
                alert(response);
            },
            error: function () {
                alert("Có lỗi xảy ra khi Tạo hợp đồng");
            }
        });

    });
</script>

</body>
</html>
